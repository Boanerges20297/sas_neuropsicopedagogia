{% load static %}
<style>
    .clinic-navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: #173f46;
        border-bottom: 1px solid rgba(255,255,255,.12);
        box-shadow: 0 10px 28px rgba(23,63,70,.18);
    }
    .clinic-navbar__inner {
        width: min(1560px, calc(100% - 48px));
        min-height: 68px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
    }
    .clinic-navbar__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        text-decoration: none;
        min-width: 240px;
    }
    .clinic-navbar__brand strong {
        display: block;
        font-size: 16px;
        line-height: 1.1;
        letter-spacing: 0;
    }
    .clinic-navbar__brand small {
        display: block;
        margin-top: 3px;
        color: #b7d8dd;
        font-size: 12px;
    }
    .clinic-navbar__logo {
        width: 42px;
        height: 42px;
        padding: 4px;
        border-radius: 8px;
        object-fit: contain;
        background: #fff;
        flex: 0 0 auto;
    }
    .clinic-navbar__links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        flex-wrap: wrap;
    }
    .clinic-navbar__links a {
        color: #e9f4f6;
        text-decoration: none;
        padding: 9px 12px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
    }
    .clinic-navbar__links a:hover,
    .clinic-navbar__links a.is-active {
        background: rgba(255,255,255,.13);
        color: #fff;
    }
    @media (max-width: 900px) {
        .clinic-navbar__inner {
            width: calc(100% - 24px);
            padding: 12px 0;
            align-items: flex-start;
            flex-direction: column;
            gap: 12px;
        }
        .clinic-navbar__links {
            justify-content: flex-start;
        }
    }
</style>
<nav class="clinic-navbar">
    <div class="clinic-navbar__inner">
        <a href="{% url 'dashboard' %}" class="clinic-navbar__brand">
            <img src="{% static 'logo.jpg' %}" alt="Logo {{ CLINICA_NOME }}" class="clinic-navbar__logo">
            <div>
                <strong>{{ CLINICA_NOME }}</strong>
                <small>Atendimento clinico</small>
            </div>
        </a>

        <div class="clinic-navbar__links">
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">Dashboard</a>
            <a href="{% url 'pacientes_list' %}" class="{% if request.resolver_match.url_name == 'pacientes_list' or request.resolver_match.url_name == 'paciente_create' or request.resolver_match.url_name == 'paciente_detail' %}is-active{% endif %}">Pacientes</a>
            <a href="{% url 'admin_avaliacoes' %}" class="{% if request.resolver_match.url_name == 'admin_avaliacoes' or request.resolver_match.url_name == 'view_avaliacao' %}is-active{% endif %}">Avaliacoes</a>
            <a href="{% url 'ia_consulta' %}" class="{% if request.resolver_match.url_name == 'ia_consulta' %}is-active{% endif %}">Consulta IA</a>
            <a href="{% url 'admin_users' %}" class="{% if request.resolver_match.url_name == 'admin_users' %}is-active{% endif %}">Usuarios</a>
            <a href="{% url 'logout' %}">Sair</a>
        </div>
    </div>
</nav>
