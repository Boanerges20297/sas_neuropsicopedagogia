{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso - Questionário Recebido</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;">
            <div style="font-size: 80px; margin-bottom: 20px; color: var(--primary-color);">✔️</div>
            <h1 style="color: var(--primary-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 28px; margin-bottom: 15px;">Questionário Recebido!</h1>
            <p style="color: var(--text-medium); font-size: 16px; max-width: 450px; line-height: 1.6; margin-bottom: 25px;">
                Agradecemos as informações fornecidas. Os dados foram salvos com segurança em conformidade com a LGPD e estão disponíveis para análise da Neuropsicopedagoga.
            </p>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <a href="{% url 'legacy_test' %}" class="login-button" style="text-decoration: none; padding: 12px 25px;">Preencher Novamente</a>
                <a href="{% url 'login' %}" class="forgot-link" style="padding: 12px 25px; border: 2px solid var(--border-color); border-radius: 12px; font-weight: bold; text-decoration: none;">Acessar Sistema</a>
            </div>
        </div>
    </div>
</body>
</html>
