<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ title }} | Neuro-Diagnosis</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#164451;background:#f4faf9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 12%,#e0f7f0 0,transparent 36%),#f4faf9;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;padding:23px clamp(20px,5vw,76px);background:#fff;border-bottom:1px solid #dfebe8}
    .brand{text-decoration:none;font-size:21px;font-weight:850;color:#066e71;letter-spacing:-.03em}
    .brand span{font-size:12px;background:#e3f8f1;border-radius:8px;padding:5px 8px;margin-left:5px;letter-spacing:0}
    .main{width:min(100% - 36px,680px);margin:auto; padding:60px 0}
    .card{background:#fff;border:1px solid #dcece8;border-radius:26px;box-shadow:0 22px 65px rgba(13,77,82,.09);padding:clamp(28px,6vw,58px)}
    .code{display:inline-flex;align-items:center;gap:10px;background:#e8f7f1;color:#08736c;border-radius:999px;font-size:12px;letter-spacing:.09em;font-weight:850;padding:9px 14px;text-transform:uppercase}
    h1{color:#154f53;font-size:clamp(28px,4.5vw,40px);line-height:1.15;letter-spacing:-.04em;margin:24px 0 12px}
    .message{font-size:17px;line-height:1.65;color:#58757c;margin:0;max-width:550px}
    .hint{margin:25px 0 0;padding:17px 19px;border-left:3px solid #0b9086;border-radius:0 12px 12px 0;background:#f3faf8;color:#355e64;font-size:14px;line-height:1.65}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    .action{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:12px 20px;text-decoration:none;font-size:14px;font-weight:750;border-radius:12px;background:#087d77;color:#fff}
    .action:hover{background:#05645e}
    .action.secondary{background:#e7f4ef;color:#176b69}
    footer{text-align:center;color:#789197;font-size:12px;padding:18px}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="{{ home_url }}">Neuro-Diagnosis <span>Plataforma</span></a></header>
  <main class="main">
    <section class="card" role="alert" aria-labelledby="error-title">
      <span class="code">Código {{ code }}</span>
      <h1 id="error-title">{{ title }}</h1>
      <p class="message">{{ message }}</p>
      <p class="hint">{{ guidance }}</p>
      <div class="actions">
        <a class="action" href="{{ home_url }}">{{ home_label }}</a>
        <a class="action secondary" href="{{ support_url }}">Entrar / verificar acesso</a>
      </div>
    </section>
  </main>
  <footer>Neuro-Diagnosis · Segurança e privacidade no atendimento</footer>
</body>
</html>
