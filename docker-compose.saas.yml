name: neuro-flask
services:
  web:
    build: .
    image: neuro-diagnosis-flask:local
    container_name: neuro-diagnosis-flask
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    env_file:
      - /etc/neuro-diagnosis/flask.env
    environment:
      DATABASE_NAME: /var/lib/neuro-diagnosis/app_database.db
      MYSQL_HOST: neuro-diagnosis-db
      MYSQL_PORT: "3306"
      BTA_BASE_URL: http://bta-license-api:8000
      BTA_CLIENT_ID: neuro-diagnosis-backend
      BTA_KEY_ID: neuro-diagnosis-prod-v2
      BTA_PRIVATE_KEY_PATH: /run/neuro-keys/neuro-prod-v2-private.pem
      BTA_TRIAL_PACKAGE_CODE: experimentar-14-dias
      DEBUG_MODE: "false"
      HOME: /tmp
      SAAS_PRIMARY: "true"
    volumes:
      - neuro_data:/var/lib/neuro-diagnosis
      - /etc/neuro-diagnosis/keys:/run/neuro-keys:ro
    ports:
      - "127.0.0.1:${NEURO_BIND_PORT:-8781}:8000"
    labels:
      - traefik.enable=${NEURO_TRAEFIK_ENABLED:-false}
      - traefik.docker.network=neuro-diagnosis_neuro-diagnosis-network
      - traefik.http.routers.neuro-flask.rule=Host(`neuro-diagnosis.tech`) || Host(`www.neuro-diagnosis.tech`)
      - traefik.http.routers.neuro-flask.entrypoints=websecure
      - traefik.http.routers.neuro-flask.tls=true
      - traefik.http.routers.neuro-flask.tls.certresolver=letsencrypt
      - traefik.http.routers.neuro-flask.priority=1000
      - traefik.http.routers.neuro-flask.service=neuro-flask
      - traefik.http.services.neuro-flask.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8000'+path,timeout=3).close() for path in ('/health/ready','/saas/saude')]"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - neuro_existing
      - bta_internal
  migrate:
    profiles: [ops]
    image: neuro-diagnosis-flask:local
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    env_file: [/etc/neuro-diagnosis/flask.env]
    environment:
      DATABASE_NAME: /var/lib/neuro-diagnosis/app_database.db
    volumes:
      - neuro_data:/var/lib/neuro-diagnosis
    command: ["sh", "-c", "python -c 'from app import init_db; init_db()' && chown -R 10001:10001 /var/lib/neuro-diagnosis"]
    networks: [neuro_existing]
volumes:
  neuro_data:
networks:
  neuro_existing:
    external: true
    name: neuro-diagnosis_neuro-diagnosis-network
  bta_internal:
    external: true
    name: bta-license-s2s
