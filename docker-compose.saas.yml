name: neuro-flask
services:
  web:
    build: .
    image: neuro-diagnosis-flask:local
    container_name: neuro-diagnosis-flask
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    env_file:
      - /etc/neuro-diagnosis/flask.env
    environment:
      DATABASE_NAME: /var/lib/neuro-diagnosis/app_database.db
      MYSQL_HOST: neuro-diagnosis-db
      MYSQL_PORT: "3306"
      BTA_BASE_URL: http://bta-license-api:8000
      BTA_CLIENT_ID: neuro-diagnosis-backend
      BTA_KEY_ID: neuro-diagnosis-prod-v2
      BTA_PRIVATE_KEY_PATH: /run/neuro-keys/neuro-prod-v2-private.pem
      BTA_TRIAL_PACKAGE_CODE: experimentar-14-dias
      DEBUG_MODE: "false"
      HOME: /tmp
      SAAS_PRIMARY: "true"
      # Bans are scoped to Neuro and shared by Gunicorn workers through
      # its pre-existing writable volume; never store raw client addresses.
      NEURO_IP_BAN_ENABLED: "${NEURO_IP_BAN_ENABLED:-true}"
      NEURO_IP_BAN_DB: /var/lib/neuro-diagnosis/neuro-ip-bans.sqlite3
      # Current Docker host gateway on Neuro's isolated 172.18 network.
      # Trust no external XFF: only this exact one-host proxy hop.
      NEURO_IP_BAN_TRUSTED_PROXIES: "${NEURO_IP_BAN_TRUSTED_PROXIES:-172.18.0.1/32}"
    volumes:
      - neuro_data:/var/lib/neuro-diagnosis
      - /etc/neuro-diagnosis/keys:/run/neuro-keys:ro
    ports:
      - "127.0.0.1:${NEURO_BIND_PORT:-8781}:8000"
    labels:
      - traefik.enable=${NEURO_TRAEFIK_ENABLED:-false}
      - traefik.docker.network=neuro-diagnosis_neuro-diagnosis-network
      - traefik.http.routers.neuro-flask.rule=Host(`neuro-diagnosis.tech`) || Host(`www.neuro-diagnosis.tech`)
      - traefik.http.routers.neuro-flask.entrypoints=websecure
      - traefik.http.routers.neuro-flask.tls=true
      - traefik.http.routers.neuro-flask.tls.certresolver=letsencrypt
      - traefik.http.routers.neuro-flask.priority=1000
      - traefik.http.routers.neuro-flask.service=neuro-flask
      # Project-scoped rate limits, not global Traefik configuration.
      # Sources are remote addresses until a verified CDN/trusted-proxy
      # configuration is deployed at the host edge; never trust arbitrary XFF.
      - traefik.http.routers.neuro-flask.middlewares=neuro-general-limit,neuro-general-rps,neuro-ip-inflight,neuro-global-inflight,neuro-body-limit
      - traefik.http.middlewares.neuro-general-limit.ratelimit.average=120
      - traefik.http.middlewares.neuro-general-limit.ratelimit.period=1m
      - traefik.http.middlewares.neuro-general-limit.ratelimit.burst=60
      - traefik.http.middlewares.neuro-general-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      # Sensitive SaaS identity endpoints receive a stricter independent pool.
      - traefik.http.routers.neuro-auth.rule=(Host(`neuro-diagnosis.tech`) || Host(`www.neuro-diagnosis.tech`)) && (PathPrefix(`/saas/entrar`) || Path(`/saas/cadastro`) || PathPrefix(`/saas/recuperar-senha`))
      - traefik.http.routers.neuro-auth.entrypoints=websecure
      - traefik.http.routers.neuro-auth.tls=true
      - traefik.http.routers.neuro-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.neuro-auth.priority=1100
      - traefik.http.routers.neuro-auth.service=neuro-flask
      - traefik.http.routers.neuro-auth.middlewares=neuro-auth-limit,neuro-auth-rps,neuro-auth-inflight,neuro-ip-inflight,neuro-global-inflight,neuro-body-limit
      - traefik.http.middlewares.neuro-auth-limit.ratelimit.average=30
      - traefik.http.middlewares.neuro-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.neuro-auth-limit.ratelimit.burst=15
      - traefik.http.middlewares.neuro-auth-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      # Per-IP second-scale throttles, layered with minute-scale limits.
      - traefik.http.middlewares.neuro-general-rps.ratelimit.average=10
      - traefik.http.middlewares.neuro-general-rps.ratelimit.period=1s
      - traefik.http.middlewares.neuro-general-rps.ratelimit.burst=24
      - traefik.http.middlewares.neuro-general-rps.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.middlewares.neuro-auth-rps.ratelimit.average=3
      - traefik.http.middlewares.neuro-auth-rps.ratelimit.period=1s
      - traefik.http.middlewares.neuro-auth-rps.ratelimit.burst=8
      - traefik.http.middlewares.neuro-auth-rps.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.middlewares.neuro-health-rps.ratelimit.average=2
      - traefik.http.middlewares.neuro-health-rps.ratelimit.period=1s
      - traefik.http.middlewares.neuro-health-rps.ratelimit.burst=5
      - traefik.http.middlewares.neuro-health-rps.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      # Docker-provider equivalent for isolated fallback; file provider owns
      # the production blue/green route and must be reconciled separately.
      - traefik.http.middlewares.neuro-global-inflight.inflightreq.amount=48
      - traefik.http.middlewares.neuro-ip-inflight.inflightreq.amount=10
      - traefik.http.middlewares.neuro-ip-inflight.inflightreq.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.middlewares.neuro-auth-inflight.inflightreq.amount=4
      - traefik.http.middlewares.neuro-auth-inflight.inflightreq.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.middlewares.neuro-body-limit.buffering.maxrequestbodybytes=2097152
      - traefik.http.middlewares.neuro-body-limit.buffering.memrequestbodybytes=2097152
      - traefik.http.routers.neuro-probes.rule=(Host(`neuro-diagnosis.tech`) || Host(`www.neuro-diagnosis.tech`)) && (Path(`/saas/saude`) || Path(`/health/ready`))
      - traefik.http.routers.neuro-probes.entrypoints=websecure
      - traefik.http.routers.neuro-probes.tls=true
      - traefik.http.routers.neuro-probes.tls.certresolver=letsencrypt
      - traefik.http.routers.neuro-probes.priority=1200
      - traefik.http.routers.neuro-probes.service=neuro-flask
      - traefik.http.routers.neuro-probes.middlewares=neuro-health-limit,neuro-health-rps,neuro-ip-inflight,neuro-global-inflight
      - traefik.http.middlewares.neuro-health-limit.ratelimit.average=30
      - traefik.http.middlewares.neuro-health-limit.ratelimit.period=1m
      - traefik.http.middlewares.neuro-health-limit.ratelimit.burst=6
      - traefik.http.middlewares.neuro-health-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.services.neuro-flask.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8000'+path,timeout=3).close() for path in ('/health/ready','/saas/saude')]"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - neuro_existing
      - bta_internal
  migrate:
    profiles: [ops]
    image: neuro-diagnosis-flask:local
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    env_file: [/etc/neuro-diagnosis/flask.env]
    environment:
      DATABASE_NAME: /var/lib/neuro-diagnosis/app_database.db
    volumes:
      - neuro_data:/var/lib/neuro-diagnosis
    command: ["sh", "-c", "python -c 'from app import init_db; init_db()' && chown -R 10001:10001 /var/lib/neuro-diagnosis"]
    networks: [neuro_existing]
volumes:
  neuro_data:
networks:
  neuro_existing:
    external: true
    name: neuro-diagnosis_neuro-diagnosis-network
  bta_internal:
    external: true
    name: bta-license-s2s
